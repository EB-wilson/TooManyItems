name: Publish Release to Steam Workshop

on:
  release:
    types: [published]

jobs:
  publish-workshop-item:
    runs-on: self-hosted
    env:
      GITHUB_WORKSPACE: ${{ github.workspace }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download JAR release asset
        uses: robinraju/release-downloader@v1
        with:
          tag: ${{ github.event.release.tag_name }}
          fileName: "*.jar"
          out-file-path: "./downloads"

      - name: Prepare Workshop Content
        run: |
          mkdir -p build_item
          mkdir -p build_item/workshop_content

          unzip -o ./downloads/*.jar -d build_item/workshop_content/
          # Steam Workshop never runs on android, so dex files are not needed
          rm build_item/workshop_content/classes.dex

          cp steam/preview.png build_item/

      - name: Generate Workshop VDF
        env:
          RELEASE_BODY_JSON: ${{ toJSON(github.event.release.body) }}
        run: |
          WORKSPACE_PATH="${GITHUB_WORKSPACE}/build_item"
          DESCRIPTION=$(printf '%s' "$RELEASE_BODY_JSON" | sed 's/^"//; s/"$//')

          cat > build_item/workshop_item.vdf << EOF
          "workshopitem"
          {
              "appid"              "1127400"
              "publishedfileid"    "3090883895"
              "contentfolder"      "${WORKSPACE_PATH}/workshop_content"
              "previewfile"        "${WORKSPACE_PATH}/preview.png"
              "changenote"         "${DESCRIPTION}"
          }
          EOF
          
          cat build_item/workshop_item.vdf

      - name: Setup SteamCMD
        uses: buildalon/setup-steamcmd@v1.4.0

      - name: Upload to Steam Workshop
        run: |
          steamcmd +login ${{ secrets.STEAM_USERNAME }} ${{ secrets.STEAM_PASSWORD }} +workshop_build_item ${GITHUB_WORKSPACE}/build_item/workshop_item.vdf +quit